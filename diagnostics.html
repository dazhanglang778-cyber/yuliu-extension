<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>语流｜开发诊断后台</title>
    <link rel="stylesheet" href="diagnostics.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">语流 · 本地可观测性与评测日志</p>
        <h1>开发诊断后台</h1>
        <p class="lead">回答“为什么错、卡在哪里、为什么慢、修复后是否复发”。记录只在本机扩展存储中保存。</p>
      </div>
      <label class="toggle"><input id="enabled" type="checkbox" /><span></span><b>记录新会话</b></label>
    </header>

    <main>
      <section class="privacy-card">
        <strong>记录边界</strong>
        <span>会记录选中词、所在局部段落、检索词、候选义项、来源、模型原始输出、校验结果、最终展示内容和耗时。</span>
        <span>不会记录 API Key、Authorization、完整网页正文，也不会自动上传。</span>
      </section>

      <section class="summary" aria-label="诊断概览">
        <article><span>已记录会话</span><strong id="total">0</strong></article>
        <article><span>含异常</span><strong id="failed">0</strong></article>
        <article><span>平均耗时</span><strong id="average">—</strong></article>
        <article><span>最近记录</span><strong id="latest">—</strong></article>
      </section>

      <section class="toolbar">
        <input id="search" type="search" placeholder="按选中词、页面或异常原因筛选" />
        <button id="export" type="button">导出诊断 JSON</button>
        <button id="clear" class="danger" type="button">清空本地记录</button>
      </section>

      <section id="empty" class="empty">
        <strong>还没有诊断记录</strong>
        <span>打开“记录新会话”，再到网页中完成一次选词解释；记录会自动出现在这里。</span>
      </section>
      <section id="sessions" class="sessions" aria-live="polite"></section>
    </main>
    <script src="diagnostics.js"></script>
  </body>
</html>
