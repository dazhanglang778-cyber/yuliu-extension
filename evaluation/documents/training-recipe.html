<body><main><article>
<h1 data-block-id="h-1">从烹饪配方到训练 Recipe</h1>
<p data-block-id="p-1">厨房里的 recipe 会列出食材、用量、步骤和火候，帮助不同的人重复做出相近结果。</p>
<p data-block-id="p-2">机器学习借用了这种说法，把训练所需的一整套搭配称为训练配方。</p>
<p data-block-id="p-3">一套训练配方通常会共同规定数据处理、优化器、学习率、批量大小、训练轮数和评测安排。</p>
<p data-block-id="p-4">团队调整训练 Recipe 时，并不是只改一个参数，而是在修改这些训练选择如何组合和执行。</p>
<p data-block-id="p-5">不同配方可能使用相同模型结构，却产生不同的收敛速度和最终效果。</p>
</article></main></body></html>
