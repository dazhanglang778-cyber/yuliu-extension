<html lang="zh-CN"><head><meta charset="utf-8"><title>人的技能与 Agent Skills</title></head>
<body><main><article>
<h1 data-block-id="h-1">人的技能与 Agent Skills</h1>
<h2 data-block-id="h-2">人员培训</h2>
<p data-block-id="p-1">新员工通过练习沟通、写作和数据分析来获得职业技能。</p>
<p data-block-id="p-2">这些 Skills 属于人的实际能力，需要通过学习和实践逐渐形成。</p>
<h2 data-block-id="h-3">Agent 能力扩展</h2>
<p data-block-id="p-3">在 Agent 系统中，开发者把一组可复用的操作说明、脚本和资源封装成能力模块。</p>
<p data-block-id="p-4">Agent 可以按任务加载不同 Skills，从而知道怎样完成某一类操作，而不必每次重新获得完整说明。</p>
<p data-block-id="p-5">这里的模块可以更新和替换，但它们不是对员工熟练程度的评价。</p>
</article></main></body></html>
