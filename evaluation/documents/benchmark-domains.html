<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>Benchmark 在不同领域的含义</title></head>
<body><main><article>
<h1 data-block-id="h-1">Benchmark 在不同领域的含义</h1>
<h2 data-block-id="h-2">测绘现场</h2>
<p data-block-id="p-1">测量人员在墙体上保留一个高程已知的固定标记。</p>
<p data-block-id="p-2">这处 Benchmark 是后续测量引用的水准基点，位置必须长期稳定。</p>
<h2 data-block-id="h-3">模型评测</h2>
<p data-block-id="p-3">研究团队准备了一组固定任务、输入数据、评分规则和基线结果。</p>
<p data-block-id="p-4">模型每次更新后都运行同一套 Benchmark，以比较能力、稳定性和成本是否发生变化。</p>
<p data-block-id="p-5">这里讨论的是评测基准，而不是地面上的永久标记。</p>
</article></main></body></html>
