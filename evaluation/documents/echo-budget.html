<body><main><article>
<h1 data-block-id="h-1">长文中的“回声预算”</h1>
<p data-block-id="p-1">本文把一次决策后允许系统继续引用旧反馈的最大轮数称为“回声预算”。</p>
<p data-block-id="p-2">预算越高，旧经验保留越久，但错误反馈也可能被重复放大；预算越低，系统则更快忘记历史。</p>
<h2 data-block-id="h-2">执行阶段</h2>
<p data-block-id="p-3">每轮任务结束后，系统给反馈标记来源、时间和剩余可引用次数。</p>
<p data-block-id="p-4">新任务只读取仍有剩余次数的反馈，并在使用后扣减一次。</p>
<p data-block-id="p-5">一家名为回声实验室的机构提供了演示数据，但机构名称与本文概念没有指称关系。</p>
<h2 data-block-id="h-3">后文结论</h2>
<p data-block-id="p-6">当任务变化频繁时，应缩短回声预算，避免过时经验持续影响新的判断。</p>
<p data-block-id="p-7">因此，回声预算控制的不是金钱，而是旧反馈还能被后续任务使用多少轮。</p>
</article></main></body></html>
