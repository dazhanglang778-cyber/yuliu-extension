<body><main><article>
<h1 data-block-id="h-1">Harness Engineering 为什么影响 Agent 表现</h1>
<p data-block-id="p-1">同一个基础模型接入不同的任务环境后，最终完成率可能出现明显差异。</p>
<p data-block-id="p-2">一组实验只改变 Harness 的工具格式和编辑接口，没有修改模型权重，代码任务得分仍然显著提高。</p>
<p data-block-id="p-3">另一组实验调整了终端调用、测试反馈和失败恢复流程，同一模型完成长任务的稳定性随之提升。</p>
<p data-block-id="p-4">这些结果表明，在纠结模型选择之前，先审视 Harness 设计往往能获得更直接的工程收益。</p>
<p data-block-id="p-5">真正限制 Agent 的不一定是写代码的能力，也可能是围绕它的结构、工具和反馈机制没有跟上。</p>
</article></main></body></html>
