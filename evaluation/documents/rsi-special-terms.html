<body><main><article>
<h1 data-block-id="h-1">自我改进系统中的反馈与增长</h1>
<p data-block-id="p-1">系统会记录每轮任务采用了什么方法、获得什么结果以及失败发生在哪里。</p>
<p data-block-id="p-2">本文把经过验证的结果重新写入数据、策略或运行规则，使其参与下一轮任务，称为经验回流。</p>
<p data-block-id="p-3">未经核验的结果不会进入回流通道，以免偶然成功被系统当成稳定规律。</p>
<p data-block-id="p-4">理论讨论中的智能爆炸，是指智能系统改进自身后进一步加快改进，最终可能形成能力快速增长的正反馈过程。</p>
<p data-block-id="p-5">这个概念描述的是一种可能的增长机制，不等同于现实系统已经实现无限增长。</p>
<p data-block-id="p-6">工程团队更关注怎样让经验回流保持可追踪、可撤销，并在任务变化后及时失效。</p>
</article></main></body></html>
