<body><main><article>
<h1 data-block-id="h-1">两个名为 Apple 的对象</h1>
<h2 data-block-id="h-2">果园记录</h2>
<p data-block-id="p-1">果园今年种植梨、桃和苹果。冷藏实验中，Apple 被作为水果样本切片称重。</p>
<p data-block-id="p-2">这批苹果的糖度和硬度会在采摘后连续记录七天。</p>
<h2 data-block-id="h-3">公司动态</h2>
<p data-block-id="p-3">在另一份商业记录中，Apple 指美国科技公司苹果公司，而不是水果。</p>
<p data-block-id="p-4">Apple 通过硬件、操作系统和服务组成产品生态，研究者据此分析平台协同。</p>
<p data-block-id="p-5">两节使用了相同英文拼写，但指称对象必须由各自章节和句子确定。</p>
</article></main></body></html>
